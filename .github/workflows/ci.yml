name: ci
on:
  push:
    branches:
      - dev
    paths-ignore:
      - "**.md"
      - "images/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "images/**"

# A new push supersedes whatever is still running for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and type-check once, not once per matrix entry.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@v7
      - name: Run check
        run: uv run make check

  ci_mysql:
    runs-on: ubuntu-latest
    services:
      database:
        image: mysql:latest
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: 123456
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        # Cover the oldest and newest supported CPython, plus free threading.
        # 3.14t verifies the freethreading_compatible declarations: without
        # them, importing asyncmy re-enables the GIL for the whole process.
        python-version: ["3.9", "3.15", "3.14t"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
      - name: Run tests
        run: uv run make test

  # MariaDB exercises server-specific paths (extended capabilities,
  # COM_STMT_BULK_EXECUTE) on the newest CPython. The MySQL matrix covers
  # interpreter compatibility and free threading.
  ci_mariadb:
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:latest
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: 123456
        options: --health-cmd="mariadb-admin ping -uroot -p${MYSQL_ROOT_PASSWORD}" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@v7
      - name: Run tests
        run: uv run make test
